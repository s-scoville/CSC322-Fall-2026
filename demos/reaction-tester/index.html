<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Time Tester</title>
    <link rel="stylesheet" href="reaction.css">
</head>

<body>
    <main class="reaction-card">
        <div class="card-header">
            <h1>Reaction Time Tester</h1>
            <span class="tech-badge">jQuery</span>
        </div>

        <p class="description">
            Test your reflexes! Wait for the signal, then click
            as quickly as you can.
        </p>

        <div id="reactionArea"
             class="reaction-area ready"
             role="button"
             tabindex="0"
             aria-label="Reaction test area">
             
            <h2 id="reactionMessage">Ready?</h2>
            <p id="reactionInstructions">
                Press Start to begin.
            </p>
        </div>

        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Last Time</span>
                <span id="lastTime" class="stat-value">-- ms</span>
            </div>

            <div class="stat-box">
                <span class="stat-label">Best Time</span>
                <span id="bestTime" class="stat-value">-- ms</span>
            </div>
        </div>

        <div class="controls">
            <button id="startButton" type="button">
                Start Test
            </button>

            <button id="resetButton" type="button">
                Reset
            </button>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="reaction.js"></script>
</body>

</html>
